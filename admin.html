
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEVEL UP | لوحة التحكم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;padding:20px}
main{max-width:850px;margin:auto}
h1{color:#ff3030}
.card{background:#171717;border:1px solid #333;border-radius:14px;padding:18px;margin:15px 0}
input,textarea,select,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #444;font-size:16px}
input,textarea,select{background:#222;color:white}
button{background:#d71920;color:white;font-weight:bold;border:0;cursor:pointer}
.secondary{background:#333}
.product{border-bottom:1px solid #444;padding:16px 0}
small{color:#bbb}
.discount-box{background:#202020;border:1px solid #444;border-radius:10px;padding:12px;margin-top:12px}
.discount-box h3{margin:5px 0 10px;color:#ff5555}
.discount-box label{display:block;margin-top:8px;color:#ddd}
.discount-status{color:#ffb347;font-size:13px}
</style>
</head>
<body>
<main>
<h1>LEVEL UP — لوحة التحكم</h1>
<div id="status">جاري الاتصال...</div>

<section class="card" id="login">
<h2>تسجيل دخول صاحب المتجر</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
</section>

<div id="dashboard" hidden>
<section class="card">
<h2>إضافة لعبة أو منتج</h2>
<input id="name" placeholder="اسم اللعبة أو المنتج">
<textarea id="description" placeholder="وصف المنتج"></textarea>
<input id="price" type="number" step="0.01" placeholder="السعر بالدينار">
<input id="category" placeholder="التصنيف، مثال: Xbox Games">
<select id="type">
<option value="shared_account">حساب مشترك</option>
<option value="personal_account">حساب شخصي</option>
<option value="subscription">اشتراك</option>
<option value="gift_card">بطاقة رقمية</option>
<option value="other">أخرى</option>
</select>
<label>صورة المنتج</label>
<input id="photo" type="file" accept="image/*">
<button onclick="addProduct()">إضافة المنتج</button>
</section>

<section class="card">
<h2>المنتجات الحالية وإدارة الخصومات</h2>
<div id="products">جاري التحميل...</div>
</section>
<button class="secondary" onclick="logout()">تسجيل خروج</button>
</div>
</main>

<script>
const SUPABASE_URL="https://miiuhfafabjwtiirirpk.supabase.co";
const SUPABASE_KEY="sb_publishable_bhRWwfsgSTnU0YB7xUWywA_6LiL5qPh";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const OWNER_EMAIL="mitabood@gmail.com";

function message(t){
 document.getElementById("status").textContent=t;
}
function owner(user){
 return user && user.email && user.email.toLowerCase()===OWNER_EMAIL.toLowerCase();
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){message("تعذر الدخول: "+error.message);return}
 if(!owner(data.user)){
  await db.auth.signOut();
  message("هذا الحساب غير مخوّل لإدارة المتجر");
  return;
 }
 await showDashboard();
}

async function showDashboard(){
 const {data}=await db.auth.getSession();
 if(!data.session || !owner(data.session.user)){
  document.getElementById("login").hidden=false;
  document.getElementById("dashboard").hidden=true;
  return;
 }
 document.getElementById("login").hidden=true;
 document.getElementById("dashboard").hidden=false;
 message("تم تسجيل الدخول");
 await loadProducts();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function addProduct(){
 const name=document.getElementById("name").value.trim();
 const price=Number(document.getElementById("price").value);
 if(!name || !Number.isFinite(price) || price<0){
  message("أدخل اسم المنتج وسعراً صحيحاً");
  return;
 }
 const file=document.getElementById("photo").files[0];
 let image_url=null;
 if(file){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
  const {error:uploadError}=await db.storage.from("product-images").upload(path,file,{upsert:false});
  if(uploadError){message("خطأ رفع الصورة: "+uploadError.message);return}
  const {data:urlData}=db.storage.from("product-images").getPublicUrl(path);
  image_url=urlData.publicUrl;
 }
 const {error}=await db.from("products").insert({
  name,
  description:document.getElementById("description").value,
  price,
  category:document.getElementById("category").value||"Xbox Games",
  product_type:document.getElementById("type").value,
  image_url,
  is_active:true
 });
 if(error){message("خطأ إضافة المنتج: "+error.message);return}
 message("تمت إضافة المنتج بنجاح");
 ["name","description","price","category","photo"].forEach(id=>{
  document.getElementById(id).value="";
 });
 await loadProducts();
}

function toLocalDateTime(value){
 if(!value)return "";
 const d=new Date(value);
 if(Number.isNaN(d.getTime()))return "";
 const pad=n=>String(n).padStart(2,"0");
 return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+
 "T"+pad(d.getHours())+":"+pad(d.getMinutes());
}

async function loadProducts(){
 const {data,error}=await db.from("products")
  .select("*").order("created_at",{ascending:false});

 if(error){
  document.getElementById("products").textContent="خطأ تحميل المنتجات: "+error.message;
  return;
 }

 const box=document.getElementById("products");
 box.innerHTML="";

 (data||[]).forEach(p=>{
  const item=document.createElement("div");
  item.className="product";

  const title=document.createElement("strong");
  title.textContent=p.name+" — "+p.price+" د.أ";

  const info=document.createElement("small");
  info.textContent=" | "+(p.is_active?"ظاهر للزبائن":"مخفي");

  const toggle=document.createElement("button");
  toggle.className="secondary";
  toggle.textContent=p.is_active?"إخفاء المنتج":"إظهار المنتج";
  toggle.onclick=()=>toggleProduct(p.id,!p.is_active);

  const del=document.createElement("button");
  del.textContent="حذف المنتج";
  del.onclick=()=>deleteProduct(p.id);
const edit=document.createElement("button");
edit.className="secondary";
edit.textContent="تعديل المنتج";
edit.onclick=()=>editProduct(p);
  const discount=document.createElement("div");
  discount.className="discount-box";

  const heading=document.createElement("h3");
  heading.textContent="إدارة الخصم";

  const priceLabel=document.createElement("label");
  priceLabel.textContent="سعر الخصم بالدينار";

  const discountPrice=document.createElement("input");
  discountPrice.type="number";
  discountPrice.step="0.01";
  discountPrice.min="0";
  discountPrice.placeholder="مثال: 15";
  discountPrice.value=p.discount_price??"";

  const dateLabel=document.createElement("label");
  dateLabel.textContent="تاريخ ووقت انتهاء الخصم";

  const endDate=document.createElement("input");
  endDate.type="datetime-local";
  endDate.value=toLocalDateTime(p.discount_ends_at);

  const activeLabel=document.createElement("label");
  activeLabel.style.display="flex";
  activeLabel.style.alignItems="center";
  activeLabel.style.gap="8px";

  const active=document.createElement("input");
  active.type="checkbox";
  active.style.width="auto";
  active.checked=!!p.discount_active;

  const activeText=document.createElement("span");
  activeText.textContent="تفعيل الخصم";

  activeLabel.append(active,activeText);

  const save=document.createElement("button");
  save.textContent="حفظ إعدادات الخصم";
  save.onclick=()=>saveDiscount(
   p.id,
   Number(p.price),
   discountPrice.value,
   endDate.value,
   active.checked
  );

  const discountStatus=document.createElement("div");
  discountStatus.className="discount-status";

  const isCurrent=!!p.discount_active &&
   p.discount_price!==null &&
   p.discount_ends_at &&
   new Date(p.discount_ends_at).getTime()>Date.now();

  discountStatus.textContent=isCurrent
   ?"الخصم مفعّل حالياً: "+p.discount_price+" د.أ"
   :(p.discount_active?"الخصم منتهي أو بياناته غير مكتملة":"لا يوجد خصم مفعّل");

  discount.append(
   heading,priceLabel,discountPrice,
   dateLabel,endDate,activeLabel,save,discountStatus
  );

  item.append(title,info,toggle,del,edit,discount);
  box.appendChild(item);
 });

 if(!data || !data.length)box.textContent="لا توجد منتجات حالياً";
}
async function editProduct(p){
  const name=prompt("اسم المنتج:",p.name);
  if(name===null)return;

  const description=prompt("وصف المنتج:",p.description||"");
  if(description===null)return;

  const price=prompt("السعر بالدينار:",p.price);
  if(price===null)return;

  const category=prompt("القسم:",p.category||"");
  if(category===null)return;

  const productType=prompt(
    "نوع المنتج:\nshared_account\npersonal_account\nsubscription\ngift_card\nother",
    p.product_type||"other"
  );
  if(productType===null)return;

  if(!name.trim()||!Number.isFinite(Number(price))||Number(price)<0){
    message("تأكد من اسم المنتج والسعر");
    return;
  }

  let image_url=p.image_url;

  if(confirm("هل تريد تغيير صورة المنتج؟")){
    
const photo=document.createElement("input");
photo.type="file";
photo.accept="image/*";
photo.style.position="fixed";
photo.style.left="0";
photo.style.top="0";
photo.style.opacity="0";
photo.style.width="1px";
photo.style.height="1px";

document.body.appendChild(photo);

const file=await new Promise(resolve=>{
  photo.onchange=()=>{
    const selected=photo.files[0] || null;
    photo.remove();
    resolve(selected);
  };

  photo.addEventListener("cancel",()=>{
    photo.remove();
    resolve(null);
  },{once:true});

  photo.click();
});
   
    if(file){
      const ext=(file.name.split(".").pop()||"jpg")
        .toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";

      const path=Date.now()+"-"+Math.random()
        .toString(36).slice(2,8)+"."+ext;

      const {error:uploadError}=await db.storage
        .from("product-images").upload(path,file);

      if(uploadError){
        message("خطأ رفع الصورة: "+uploadError.message);
        return;
      }

      const {data:urlData}=db.storage
        .from("product-images").getPublicUrl(path);

      image_url=urlData.publicUrl;
    }
  }

  const {error}=await db.from("products").update({
    name:name.trim(),
    description:description.trim(),
    price:Number(price),
    category:category.trim(),
    product_type:productType,
    image_url:image_url
  }).eq("id",p.id);

  if(error){
    message("فشل تعديل المنتج: "+error.message);
    return;
  }

  message("تم تعديل المنتج بنجاح");
  await loadProducts();
}
async function saveDiscount(id,originalPrice,priceValue,endValue,isActive){
 const discountPrice=priceValue.trim()===""?null:Number(priceValue);
 let endsAt=null;

 if(isActive){
  if(discountPrice===null || !Number.isFinite(discountPrice) ||
     discountPrice<=0 || discountPrice>=originalPrice){
   message("سعر الخصم لازم يكون أقل من السعر الأصلي وأكبر من صفر");
   return;
  }

  if(!endValue){
   message("حدد تاريخ ووقت انتهاء الخصم");
   return;
  }

  const endDate=new Date(endValue);
  if(Number.isNaN(endDate.getTime()) || endDate.getTime()<=Date.now()){
   message("تاريخ انتهاء الخصم لازم يكون بالمستقبل");
   return;
  }

  endsAt=endDate.toISOString();
 }else{
  if(discountPrice!==null &&
     (!Number.isFinite(discountPrice) || discountPrice<=0 ||
      discountPrice>=originalPrice)){
   message("سعر الخصم لازم يكون أقل من السعر الأصلي وأكبر من صفر");
   return;
  }

  if(endValue){
   const endDate=new Date(endValue);
   if(!Number.isNaN(endDate.getTime()))endsAt=endDate.toISOString();
  }
 }

 const {error}=await db.from("products").update({
  discount_price:discountPrice,
  discount_ends_at:endsAt,
  discount_active:isActive
 }).eq("id",id);

 if(error){
  message("خطأ حفظ الخصم: "+error.message);
  return;
 }

 message(isActive?"تم حفظ وتفعيل الخصم بنجاح":"تم حفظ إعدادات الخصم وإيقافه");
 await loadProducts();
}

async function toggleProduct(id,active){
 const {error}=await db.from("products").update({is_active:active}).eq("id",id);
 if(error){message("خطأ: "+error.message);return}
 await loadProducts();
}

async function deleteProduct(id){
 if(!confirm("متأكد إنك بدك تحذف المنتج؟"))return;
 const {error}=await db.from("products").delete().eq("id",id);
 if(error){message("خطأ: "+error.message);return}
 message("تم حذف المنتج");
 await loadProducts();
}

db.auth.getSession().then(({data})=>{
 if(data.session && owner(data.session.user))showDashboard();
 else message("سجّل الدخول للمتابعة");
});
</script>
</body>
</html>
