<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEVEL UP | لوحة التحكم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;padding:20px}
main{max-width:850px;margin:auto}
h1{color:#ff3030}
.card{background:#171717;border:1px solid #333;border-radius:14px;padding:18px;margin:15px 0}
input,textarea,select,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #444;font-size:16px}
input,textarea,select{background:#222;color:white}
button{background:#d71920;color:white;font-weight:bold;border:0}
.secondary{background:#333}
.product{border-bottom:1px solid #444;padding:12px 0}
small{color:#bbb}
</style>
</head>
<body>
<main>
<h1>LEVEL UP — لوحة التحكم</h1>
<div id="status">جاري الاتصال...</div>

<section class="card" id="login">
<h2>تسجيل دخول صاحب المتجر</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
</section>

<div id="dashboard" hidden>
<section class="card">
<h2>إضافة لعبة أو منتج</h2>
<input id="name" placeholder="اسم اللعبة أو المنتج">
<textarea id="description" placeholder="وصف المنتج"></textarea>
<input id="price" type="number" step="0.01" placeholder="السعر بالدينار">
<input id="category" placeholder="التصنيف، مثال: Xbox Games">
<select id="type">
<option value="shared_account">حساب مشترك</option>
<option value="personal_account">حساب شخصي</option>
<option value="subscription">اشتراك</option>
<option value="gift_card">بطاقة رقمية</option>
<option value="other">أخرى</option>
</select>
<label>صورة المنتج</label>
<input id="photo" type="file" accept="image/*">
<button onclick="addProduct()">إضافة المنتج</button>
</section>

<section class="card">
<h2>المنتجات الحالية</h2>
<div id="products">جاري التحميل...</div>
</section>
<button class="secondary" onclick="logout()">تسجيل خروج</button>
</div>
</main>

<script>
const SUPABASE_URL="https://miiuhfafabjwtiirirpk.supabase.co";
const SUPABASE_KEY="sb_publishable_bhRWwfsgSTnU0YB7xUWywA_6LiL5qPh";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const OWNER_EMAIL="mitabood@gmail.com";

function message(t){document.getElementById("status").textContent=t}
function owner(user){return user && user.email && user.email.toLowerCase()===OWNER_EMAIL.toLowerCase()}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){message("تعذر الدخول: "+error.message);return}
 if(!owner(data.user)){await db.auth.signOut();message("هذا الحساب غير مخوّل لإدارة المتجر");return}
 await showDashboard();
}

async function showDashboard(){
 const {data}=await db.auth.getSession();
 if(!data.session || !owner(data.session.user)){
  document.getElementById("login").hidden=false;
  document.getElementById("dashboard").hidden=true;
  return;
 }
 document.getElementById("login").hidden=true;
 document.getElementById("dashboard").hidden=false;
 message("تم تسجيل الدخول");
 await loadProducts();
}

async function logout(){await db.auth.signOut();location.reload()}

async function addProduct(){
 const name=document.getElementById("name").value.trim();
 const price=Number(document.getElementById("price").value);
 if(!name || !Number.isFinite(price) || price<0){message("أدخل اسم المنتج وسعراً صحيحاً");return}
 const file=document.getElementById("photo").files[0];
 let image_url=null;
 if(file){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
  const {error:uploadError}=await db.storage.from("product-images").upload(path,file,{upsert:false});
  if(uploadError){message("خطأ رفع الصورة: "+uploadError.message);return}
  const {data:urlData}=db.storage.from("product-images").getPublicUrl(path);
  image_url=urlData.publicUrl;
 }
 const {error}=await db.from("products").insert({
  name,
  description:document.getElementById("description").value,
  price,
  category:document.getElementById("category").value||"Xbox Games",
  product_type:document.getElementById("type").value,
  image_url,
  is_active:true
 });
 if(error){message("خطأ إضافة المنتج: "+error.message);return}
 message("تمت إضافة المنتج بنجاح");
 ["name","description","price","category","photo"].forEach(id=>document.getElementById(id).value="");
 await loadProducts();
}

async function loadProducts(){
 const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});
 if(error){document.getElementById("products").textContent="خطأ تحميل المنتجات: "+error.message;return}
 const box=document.getElementById("products");
 box.innerHTML="";
 (data||[]).forEach(p=>{
  const item=document.createElement("div");
  item.className="product";
  const title=document.createElement("strong");
  title.textContent=p.name+" — "+p.price+" د.أ";
  const info=document.createElement("small");
  info.textContent=" | "+(p.is_active?"ظاهر للزبائن":"مخفي");
  const toggle=document.createElement("button");
  toggle.className="secondary";
  toggle.textContent=p.is_active?"إخفاء المنتج":"إظهار المنتج";
  toggle.onclick=()=>toggleProduct(p.id,!p.is_active);
  const del=document.createElement("button");
  del.textContent="حذف المنتج";
  del.onclick=()=>deleteProduct(p.id);
  item.append(title,info,toggle,del);
  box.appendChild(item);
 });
 if(!data || !data.length)box.textContent="لا توجد منتجات حالياً";
}

async function toggleProduct(id,active){
 const {error}=await db.from("products").update({is_active:active}).eq("id",id);
 if(error){message("خطأ: "+error.message);return}
 await loadProducts();
}

async function deleteProduct(id){
 if(!confirm("متأكد إنك بدك تحذف المنتج؟"))return;
 const {error}=await db.from("products").delete().eq("id",id);
 if(error){message("خطأ: "+error.message);return}
 message("تم حذف المنتج");
 await loadProducts();
}

db.auth.getSession().then(({data})=>{
 if(data.session && owner(data.session.user))showDashboard();
 else message("سجّل الدخول للمتابعة");
});
</script>
</body>
</html>
